name: CI — Test · Lint · Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test · lint · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (vitest)
        run: npm test

      - name: Grid class guard (mobile-first sweep)
        run: npm run guard:grid
        # Repo-wide static scan: every responsive grid-cols-* must declare an
        # explicit base grid-cols-1 (or be a breakpoint-gated grid / reviewed
        # allowlist entry). Runs alongside vitest so a copy-pasted desktop-only
        # grid className fails CI before it ships.

      - name: Build
        run: npm run build

      - name: Smoke test built app (vite preview + route curls)
        run: npm run check:smoke
        # Boots `vite preview` against dist/ and curls /, /benchmark, /app,
        # /app/admin — fails the build on non-200 responses, an empty SPA
        # shell, a missing #root mount, or a missing hashed JS bundle.
        # Client-side rendering can't be asserted via curl; this gate catches
        # the shell/asset regressions that produce blank pages.

  audits:
    name: Audits (responsive overflow + a11y + mobile-first)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Responsive audit (640/768/1024/1280)
        run: npm run audit:responsive
        # Boots vite in mock mode, signs in as the seeded mock admin, and walks
        # every public + /app/* + /app/admin/* route at 640px, 768px, 1024px,
        # and 1280px, failing on page-level horizontal overflow or clipped
        # in-flow elements (the grid/table regression class). New routes must be
        # added to the inventory in scripts/audit-responsive.mjs to stay under
        # the gate.

      - name: A11y audit (names, labels, alt, focus, contrast)
        run: npm run audit:a11y
        # Boots vite in mock mode, signs in as the seeded mock admin, and walks
        # every app + admin + public surface, failing on structural a11y
        # issues: interactive elements with no accessible name, <img> without
        # alt, unlabeled form controls, and keyboard-Tab stops with no visible
        # focus indicator (real :focus-visible via Playwright Tab presses).
        # Contrast is reported as advisories. New routes must be added to the
        # inventory in scripts/audit-a11y.mjs to stay under the gate.

  backend:
    name: Backend (build · unit · e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies (pnpm 9, matching backend:install)
        run: npx pnpm@9 install --dir backend --frozen-lockfile

      - name: Build
        run: npm run backend:build

      - name: Migration convergence (file set + order vs runbook)
        run: npm --prefix backend run check:migrations
        # Runs the real applier in --dry-run (no env/DB needed) and compares
        # the migration file set + order against the canonical manifest
        # embedded in docs/engineering/MIGRATION_RUNBOOK.md. Fails if a new
        # migration was added without a runbook regen, a file was renamed/
        # reordered, or the runbook lists a file that no longer exists. Fix:
        #   npm --prefix backend run check:migrations -- --fix

      - name: Unit tests (jest)
        run: npm --prefix backend test

      - name: E2E tests (in-memory Nest app, no server/env required)
        run: npm run backend:test:e2e
