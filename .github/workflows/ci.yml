name: CI — Test · Lint · Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test · lint · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test built app (vite preview + route curls)
        run: npm run check:smoke
        # Boots `vite preview` against dist/ and curls /, /benchmark, /app,
        # /app/admin — fails the build on non-200 responses, an empty SPA
        # shell, a missing #root mount, or a missing hashed JS bundle.
        # Client-side rendering can't be asserted via curl; this gate catches
        # the shell/asset regressions that produce blank pages.

  responsive:
    name: Responsive audit (768/1280 overflow gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Responsive audit (768/1280)
        run: npm run audit:responsive
        # Boots vite in mock mode, signs in as the seeded mock admin, and walks
        # every public + /app/* + /app/admin/* route at 768px and 1280px,
        # failing on page-level horizontal overflow or clipped in-flow elements
        # (the grid/table regression class). New routes must be added to the
        # inventory in scripts/audit-responsive.mjs to stay under the gate.

  backend:
    name: Backend (build · unit · e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies (pnpm 9, matching backend:install)
        run: npx pnpm@9 install --dir backend --frozen-lockfile

      - name: Build
        run: npm run backend:build

      - name: Unit tests (jest)
        run: npm --prefix backend test

      - name: E2E tests (in-memory Nest app, no server/env required)
        run: npm run backend:test:e2e
